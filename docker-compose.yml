# Nivisa - the whole stack, locally, with no paid account anywhere.
#
#   docker compose up --build
#
#   Storefront        http://localhost:3001
#   Admin dashboard   http://localhost:5174
#   API + docs        http://localhost:8000/docs
#   Mail inbox        http://localhost:8025
#   Postgres          localhost:5433  (nivisa / nivisa)
#
# Nothing here reaches a payment gateway, an SMS provider, a CDN or a mail
# relay. Going to production is a matter of pointing DATABASE_URL at a managed
# Postgres and flipping the four *_PROVIDER variables - see apis/.env.example.

name: nivisa

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nivisa
      POSTGRES_PASSWORD: nivisa
      POSTGRES_DB: nivisa
    ports:
      # 5433 on the host, 5432 inside. A native PostgreSQL install owns 5432
      # on most developer machines, and this mapping exists only so a GUI
      # client can connect - the API reaches the database over the compose
      # network, where the port is still 5432.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # The API waits on this rather than on the container merely existing;
      # Postgres accepts connections several seconds after the process starts.
      test: ["CMD-SHELL", "pg_isready -U nivisa -d nivisa"]
      interval: 5s
      timeout: 3s
      retries: 12

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mail:
    # A real SMTP server with a web inbox. Order confirmations are genuinely
    # sent and genuinely rendered - they just cannot leave the machine.
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  api:
    build: ./apis
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://nivisa:nivisa@db:5432/nivisa
      REDIS_URL: redis://cache:6379/0
      SECRET_KEY: local-development-only-not-a-production-secret
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5174
      # Where the payment gateway returns the browser.
      STOREFRONT_URL: http://localhost:3001
      # Where a browser reaches this API, for redirects and emailed links.
      PUBLIC_API_URL: http://localhost:8000

      # Everything that would cost money runs locally.
      PAYMENT_PROVIDER: mock
      STORAGE_PROVIDER: local
      EMAIL_PROVIDER: smtp
      SMS_PROVIDER: console
      SMTP_HOST: mail
      SMTP_PORT: 1025
      MEDIA_ROOT: /data/media

      SUPER_ADMIN_EMAIL: superadmin@nivisa.in
      SUPER_ADMIN_PASSWORD: Nivisa@2026
      SUPER_ADMIN_NAME: Super Admin
    ports:
      - "8000:8000"
    volumes:
      - ./apis:/app
      - media:/data/media
    # Seed runs on every start and is idempotent, so a fresh volume comes up
    # populated and an existing one is left alone.
    command: >
      sh -c "python -m scripts.seed &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./web
    depends_on:
      - api
    environment:
      # Two URLs for one API, because the same fetch code runs on both sides
      # of a network boundary. The browser reaches it on the published host
      # port; the Next.js server, inside the compose network, reaches it at
      # "api". One value for both leaves server-rendered pages empty.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      INTERNAL_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3001
      NEXT_PUBLIC_DEMO_CONTENT: "false"
      # Inotify events do not cross a Docker bind mount from a Windows host,
      # so the dev server polls instead. Read by next.config.ts; the old
      # WATCHPACK_POLLING was a webpack variable and Turbopack never saw it.
      NEXT_WATCH_POLL_MS: "300"
    # Webpack rather than the default Turbopack, and only here. Turbopack's
    # file watcher does not work over this bind mount from a Windows host -
    # it logs "watch error ... NotFound" at startup and then never rebuilds,
    # so every edit needed the container restarting by hand and looked like
    # the edit had not taken. Webpack polls instead, at the interval
    # next.config.ts reads from NEXT_WATCH_POLL_MS. Running natively is
    # unaffected and still uses Turbopack.
    command: ["npm", "run", "dev", "--", "--webpack"]
    ports:
      # 3001 on the host: port 3000 is taken by another project on this
      # machine. The container keeps Next.js's own default inside, so only
      # the published port differs.
      - "3001:3000"
    volumes:
      - ./web:/app
      # Anonymous volumes so the container keeps its own Linux-built
      # node_modules and its own build cache rather than the host's.
      - /app/node_modules
      - /app/.next

  admin:
    build: ./admin_dashboard
    depends_on:
      - api
    environment:
      # The dashboard talks to the API through Vite's proxy, so the browser
      # only ever sees same-origin requests and CORS never enters into it.
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5174:5174"
    volumes:
      - ./admin_dashboard:/app
      # Anonymous volume so the container keeps its own Linux-built
      # node_modules instead of the host's, which on Windows are the wrong
      # platform's binaries.
      - /app/node_modules

volumes:
  db-data:
  media:
